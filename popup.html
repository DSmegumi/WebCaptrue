<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>WebCaptrue</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <div>
        <h1>WebCaptrue</h1>
        <p id="target" class="muted">读取当前页面…</p>
      </div>
      <span id="badge" class="badge idle">IDLE</span>
    </header>

    <section class="stats" aria-label="采集统计">
      <div><strong id="requests">0</strong><span>请求</span></div>
      <div><strong id="responses">0</strong><span>响应</span></div>
      <div><strong id="apis">0</strong><span>API</span></div>
      <div><strong id="actions">0</strong><span>操作</span></div>
      <div><strong id="consoleCount">0</strong><span>日志</span></div>
      <div><strong id="screenshots">0</strong><span>截图</span></div>
      <div><strong id="targets">0</strong><span>子目标</span></div>
      <div><strong id="storageSnapshots">0</strong><span>存储快照</span></div>
    </section>

    <label class="option">
      <input id="captureBodies" type="checkbox" checked>
      <span>保存响应正文（默认单个最多 5 MB）</span>
    </label>
    <label class="option">
      <input id="autoScreenshots" type="checkbox" checked>
      <span>关键操作自动截图</span>
    </label>
    <label class="option">
      <input id="captureClientStorage" type="checkbox" checked>
      <span>保存页面存储（IndexedDB / Cache Storage）</span>
    </label>

    <button id="primary" type="button">开始完整采集</button>
    <p id="message" class="message"></p>
    <p class="footnote">快捷键 Ctrl+Shift+Y 可开始或停止采集。默认脱敏 Cookie、Authorization、Set-Cookie 和密码输入。</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
