name: Release CRX

on:
  push:
    branches:
      - main
    paths:
      - "release-assets/*.json"
      - "release-assets/*.crx"
      - "release-assets/**/*.b64"
      - "manifest.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./manifest.json').version")"
          TAG="v${VERSION}"
          DESCRIPTOR="release-assets/${VERSION}.json"
          test -f "$DESCRIPTOR" || { echo "::error::Missing release descriptor: $DESCRIPTOR"; exit 1; }
          DESCRIPTOR_VERSION="$(node -p "require('./${DESCRIPTOR}').version")"
          FILE_NAME="$(node -p "require('./${DESCRIPTOR}').fileName")"
          SOURCE_PATH="$(node -p "require('./${DESCRIPTOR}').sourcePath || ''")"
          PARTS_DIR="$(node -p "require('./${DESCRIPTOR}').partsDir || ''")"
          EXPECTED_SHA="$(node -p "require('./${DESCRIPTOR}').sha256")"
          EXPECTED_SIZE="$(node -p "require('./${DESCRIPTOR}').size")"
          test "$DESCRIPTOR_VERSION" = "$VERSION" || { echo "::error::Descriptor version mismatch: expected $VERSION, got $DESCRIPTOR_VERSION"; exit 1; }
          test -n "$FILE_NAME" && test -n "$EXPECTED_SHA" && test -n "$EXPECTED_SIZE"
          if [ -z "$PARTS_DIR" ]; then
            test -n "$SOURCE_PATH"
            test "$SOURCE_PATH" = "release-assets/$FILE_NAME" || { echo "::error::Unexpected CRX source path: $SOURCE_PATH"; exit 1; }
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "file_name=$FILE_NAME" >> "$GITHUB_OUTPUT"
          echo "source_path=$SOURCE_PATH" >> "$GITHUB_OUTPUT"
          echo "parts_dir=$PARTS_DIR" >> "$GITHUB_OUTPUT"
          echo "expected_sha=$EXPECTED_SHA" >> "$GITHUB_OUTPUT"
          echo "expected_size=$EXPECTED_SIZE" >> "$GITHUB_OUTPUT"

      - name: Stage signed CRX from repository
        shell: bash
        env:
          SOURCE_PATH: ${{ steps.meta.outputs.source_path }}
          PARTS_DIR: ${{ steps.meta.outputs.parts_dir }}
          FILE_NAME: ${{ steps.meta.outputs.file_name }}
        run: |
          set -euo pipefail
          if [ -n "$PARTS_DIR" ]; then
            test -d "$PARTS_DIR" || { echo "::error::Missing CRX parts directory: $PARTS_DIR"; exit 1; }
            mapfile -t PARTS < <(find "$PARTS_DIR" -maxdepth 1 -type f -name 'part-*.b64' | sort)
            test "${#PARTS[@]}" -gt 0 || { echo "::error::No CRX parts found in $PARTS_DIR"; exit 1; }
            cat "${PARTS[@]}" | base64 --decode > "$FILE_NAME"
          else
            test -f "$SOURCE_PATH" || { echo "::error::Missing signed CRX: $SOURCE_PATH"; exit 1; }
            cp "$SOURCE_PATH" "$FILE_NAME"
          fi
          test -s "$FILE_NAME"

      - name: Verify size and SHA-256
        shell: bash
        env:
          FILE_NAME: ${{ steps.meta.outputs.file_name }}
          EXPECTED_SHA: ${{ steps.meta.outputs.expected_sha }}
          EXPECTED_SIZE: ${{ steps.meta.outputs.expected_size }}
        run: |
          set -euo pipefail
          ACTUAL_SIZE="$(stat -c '%s' "$FILE_NAME")"
          test "$ACTUAL_SIZE" = "$EXPECTED_SIZE" || { echo "::error::CRX size mismatch: expected $EXPECTED_SIZE, got $ACTUAL_SIZE"; exit 1; }
          echo "$EXPECTED_SHA  $FILE_NAME" | sha256sum --check --strict

      - name: Verify CRX3 package
        shell: bash
        env:
          FILE_NAME: ${{ steps.meta.outputs.file_name }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, struct
          p = Path(os.environ["FILE_NAME"])
          data = p.read_bytes()
          if data[:4] != b"Cr24":
              raise SystemExit("Not a CRX package: invalid magic")
          version = struct.unpack("<I", data[4:8])[0]
          if version != 3:
              raise SystemExit(f"Expected CRX3, got CRX version {version}")
          print(f"Verified CRX3: {p} ({len(data)} bytes)")
          PY

      - name: Generate checksum
        shell: bash
        env:
          FILE_NAME: ${{ steps.meta.outputs.file_name }}
        run: |
          sha256sum "$FILE_NAME" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          FILE_NAME: ${{ steps.meta.outputs.file_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE_NAME" SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" \
              "$FILE_NAME" \
              SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title "WebCaptrue $TAG" \
              --generate-notes
          fi
